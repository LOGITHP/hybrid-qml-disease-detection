# Hybrid QML Disease Detection Backend Configuration
application:
  name: "Hybrid QML Disease Detection Platform API"
  version: "0.1.0"
  api_version: "v1"
  environment: "development"
  log_level: "INFO"

server:
  host: "0.0.0.0"
  port: 8000

security:
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 60
  refresh_token_expire_days: 7

storage:
  artifact_root: "./artifacts"

quantum:
  default_shots: 1000
  supported_simulation_devices:
    - "default.qubit"
    - "default.mixed"

ai_agent:
  default_provider: "gemini"
  default_model: "gemini-1.5-flash"
