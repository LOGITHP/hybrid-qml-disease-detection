version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hybrid_qml_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hybrid_qml_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hybrid_qml_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hybrid_qml_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gemma:
    build:
      context: ./backend/gemma
      dockerfile: Dockerfile
    container_name: hybrid_qml_gemma
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LLM_MODEL=google/gemma-2b-it
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybrid_qml_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/hybrid_qml_db
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACT_ROOT=/app/artifacts
      - JWT_SECRET=phase1_docker_development_secret_key_at_least_32_bytes_long!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000,http://frontend:80
      - LLM_PROVIDER=gemma
      - LLM_MODEL=google/gemma-2b-it
      - LLM_BASE_URL=http://gemma:8001
    volumes:
      - ./backend:/app
      - backend_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gemma:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybrid_qml_worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/hybrid_qml_db
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACT_ROOT=/app/artifacts
    volumes:
      - ./backend:/app
      - backend_artifacts:/app/artifacts
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hybrid_qml_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_artifacts:
