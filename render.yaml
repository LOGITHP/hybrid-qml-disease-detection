services:
  # Backend Web Service using Docker
  - type: web
    name: disease-detection-backend
    env: docker
    plan: free
    rootDir: Diseases_Detection_Paltform/backend
    # Optional: explicitly tell Render where the Dockerfile is relative to rootDir
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: hybrid_qml_db
      - key: ENVIRONMENT
        value: production

  # Frontend Static Site
  - type: static
    name: disease-detection-frontend
    env: static
    rootDir: Diseases_Detection_Paltform/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://disease-detection-backend.onrender.com/api/v1
